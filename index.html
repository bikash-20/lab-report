<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MU Cover Page Generator</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: Arial, sans-serif; background: #eef1f7; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; }
img { width: 260px; }
h2 { color: #1a3a6b; font-size: 16px; font-weight: 600; text-align: center; }
.cards { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
a.card {
  display: block; background: white; border-radius: 12px; padding: 28px 36px;
  text-align: center; text-decoration: none; color: #1a3a6b;
  box-shadow: 0 4px 16px rgba(26,58,107,0.1); font-size: 15px; font-weight: 700;
  transition: transform 0.15s, box-shadow 0.15s;
}
a.card:hover { transform: translateY(-3px); box-shadow: 0 8px 24px rgba(26,58,107,0.18); }
a.card span { display: block; font-size: 32px; margin-bottom: 10px; }
</style>
</head>
<body>
  <img src="logo.png" alt="Metropolitan University"/>
  <h2>Cover Page Generator</h2>
  <div class="cards">
    <a class="card" href="assignment-cover.html"><span>📄</span>Assignment Cover</a>
    <a class="card" href="lab-cover.html"><span>🧪</span>Lab Report Cover</a>
  </div>
</body>
</html>
